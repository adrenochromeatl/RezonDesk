<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RezonDesk</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Компании</h1>

        <!-- Форма для добавления компании -->
        <div class="card mb-4 shadow">
            <div class="card-body">
                <h5 class="card-title">Добавить компанию</h5>
                <form action="/companies/" method="post">
                    <div class="mb-3">
                        <label for="companyName" class="form-label">Название компании</label>
                        <input type="text" class="form-control" id="companyName" name="name" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </form>
            </div>
        </div>

        <!-- Список компаний -->
        <div class="row">
            {% for company in companies %}
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">{{ company.name }}</h5>

                        <h6 class="mt-3">Объекты:</h6>
                        <ul class="list-group">
                            {% for obj in company.objects %}
                            <li class="list-group-item">{{ obj.name }}</li>
                            {% endfor %}
                        </ul>

                        <h6 class="mt-3">Юрлица:</h6>
                        <ul class="list-group">
                            {% for legal in company.legal_entities %}
                            <li class="list-group-item">{{ legal.name }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
