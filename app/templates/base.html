<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RezonDesk</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        /* Стили для боковой панели */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #f8f9fa;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            transition: width 0.3s;
        }

        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar.collapsed .sidebar-text {
            display: none;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            transition: margin-left 0.3s;
        }

        .main-content.collapsed {
            margin-left: 60px;
        }

        .sidebar-toggle {
            cursor: pointer;
            margin-bottom: 20px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 10px;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .sidebar-link:hover {
            background-color: #e9ecef;
        }

        .sidebar-icon {
            margin-right: 10px;
        }

        .sidebar-text {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- Боковая панель -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-toggle" onclick="toggleSidebar()">
            <span class="sidebar-icon">&#9776;</span>
            <span class="sidebar-text">Свернуть</span>
        </div>

        <a href="/tickets" class="sidebar-link">
            <span class="sidebar-icon">📝</span>
            <span class="sidebar-text">Заявки</span>
        </a>

        <a href="/company" class="sidebar-link">
            <span class="sidebar-icon">🏢</span>
            <span class="sidebar-text">Справочник компаний</span>
        </a>

        <a href="/legal-entities" class="sidebar-link">
            <span class="sidebar-icon">📜</span>
            <span class="sidebar-text">Юр. лица</span>
        </a>

        <a href="/objects" class="sidebar-link">
            <span class="sidebar-icon">🏭</span>
            <span class="sidebar-text">Объекты</span>
        </a>

        <a href="/equipment" class="sidebar-link">
            <span class="sidebar-icon">🖥️</span>
            <span class="sidebar-text">Оборудование</span>
        </a>

        <a href="/bz" class="sidebar-link">
            <span class="sidebar-icon">📚</span>
            <span class="sidebar-text">База знаний</span>
        </a>
    </div>

    <!-- Основной контент -->
    <div class="main-content" id="mainContent">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS и кастомный скрипт -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Функция для сворачивания/разворачивания боковой панели
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('collapsed');

            // Меняем текст кнопки
            const toggleButton = document.querySelector('.sidebar-toggle');
            const toggleText = toggleButton.querySelector('.sidebar-text');
            if (sidebar.classList.contains('collapsed')) {
                toggleText.textContent = 'Развернуть';
            } else {
                toggleText.textContent = 'Свернуть';
            }
        }
    </script>
</body>
</html>
